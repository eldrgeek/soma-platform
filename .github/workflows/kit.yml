# Runs the SOMA app-kit package tests (contracts, conformance, scaffolder) on
# every pull request that touches those packages. Added 2026-10-23 (bead sp-dha):
# kit PRs previously had only a Netlify deploy preview; pr-merge-green needs
# at least one real check before it will merge.
name: kit

on:
  pull_request:
    paths:
      - 'packages/soma-contracts/**'
      - 'packages/soma-conformance/**'
      - 'packages/soma-scaffolder/**'
      - 'packages/soma-actions/**'
      - 'packages/soma-discovery/**'
      - 'packages/soma-meter/**'
      - 'packages/soma-catalog/**'
      - 'packages/soma-puppet-runtime/src/parser.js'
      - 'packages/soma-puppet-runtime/src/render.js'
      - 'packages/soma-puppet-runtime/scripts/vendor-store.mjs'
      - 'packages/soma-puppet-runtime/site/public/vendor/manifest.json'
      - '.github/workflows/kit.yml'
  push:
    branches:
      - master
    paths:
      - 'packages/soma-contracts/**'
      - 'packages/soma-conformance/**'
      - 'packages/soma-scaffolder/**'
      - 'packages/soma-actions/**'
      - 'packages/soma-discovery/**'
      - 'packages/soma-meter/**'
      - 'packages/soma-catalog/**'
      - 'packages/soma-puppet-runtime/src/parser.js'
      - 'packages/soma-puppet-runtime/src/render.js'
      - 'packages/soma-puppet-runtime/scripts/vendor-store.mjs'
      - 'packages/soma-puppet-runtime/site/public/vendor/manifest.json'
      - '.github/workflows/kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: soma-contracts — install
        working-directory: packages/soma-contracts
        run: timeout 15m npm ci
      - name: soma-contracts — test
        working-directory: packages/soma-contracts
        run: npm test

      - name: soma-discovery — install
        working-directory: packages/soma-discovery
        run: timeout 15m npm ci
      - name: soma-discovery — test
        working-directory: packages/soma-discovery
        run: npm test
      - name: soma-discovery — mutation-check
        working-directory: packages/soma-discovery
        run: timeout 10m npm run mutation-check
      - name: soma-discovery — mutation-check clean tree
        run: test -z "$(git status --porcelain)"

      - name: soma-conformance — install
        working-directory: packages/soma-conformance
        run: timeout 15m npm ci
      - name: soma-conformance — test
        working-directory: packages/soma-conformance
        run: npm test
      - name: soma-conformance — mutation-check
        working-directory: packages/soma-conformance
        run: timeout 10m npm run mutation-check
      - name: soma-conformance — mutation-check clean tree
        run: test -z "$(git status --porcelain)"
      - name: soma-conformance — mutation-check-c15
        working-directory: packages/soma-conformance
        run: timeout 10m npm run mutation-check-c15
      - name: soma-conformance — mutation-check-c15 clean tree
        run: test -z "$(git status --porcelain)"

      - name: soma-scaffolder — install
        working-directory: packages/soma-scaffolder
        run: timeout 15m npm ci
      - name: soma-scaffolder — test
        working-directory: packages/soma-scaffolder
        run: npm test
      - name: soma-scaffolder — mutation-check-v1-guards
        working-directory: packages/soma-scaffolder
        run: timeout 10m npm run mutation-check-v1-guards
      - name: soma-scaffolder — mutation-check-v1-guards clean tree
        run: test -z "$(git status --porcelain)"
      - name: soma-scaffolder — mutation-check-cli-refusal
        working-directory: packages/soma-scaffolder
        run: timeout 10m npm run mutation-check-cli-refusal
      - name: soma-scaffolder — mutation-check-cli-refusal clean tree
        run: test -z "$(git status --porcelain)"
      - name: soma-scaffolder — mutation-check-v1-feedback
        working-directory: packages/soma-scaffolder
        run: timeout 10m npm run mutation-check-v1-feedback
      - name: soma-scaffolder — mutation-check-v1-feedback clean tree
        run: test -z "$(git status --porcelain)"

      - name: soma-actions — install
        working-directory: packages/soma-actions
        run: timeout 5m npm install --no-package-lock
      - name: soma-actions — test
        working-directory: packages/soma-actions
        run: timeout 10m npm test
      - name: soma-actions — mutation-check
        working-directory: packages/soma-actions
        run: timeout 10m npm run mutation-check
      - name: soma-actions — mutation-check clean tree
        run: test -z "$(git status --porcelain)"

      - name: soma-meter — install
        working-directory: packages/soma-meter
        run: timeout 5m npm install --no-package-lock
      - name: soma-meter — test
        working-directory: packages/soma-meter
        run: timeout 10m npm test
      - name: soma-meter — mutation-check
        working-directory: packages/soma-meter
        run: timeout 10m npm run mutation-check
      - name: soma-meter — mutation-check clean tree
        run: test -z "$(git status --porcelain)"

      # The component catalog: one record per Puppet word. Its tests fail when the parser gains a word
      # with no record, or a record's placement, version, rendering or pin stops being true.
      - name: soma-catalog — install
        working-directory: packages/soma-catalog
        run: timeout 15m npm ci
      - name: soma-catalog — test
        working-directory: packages/soma-catalog
        run: timeout 10m npm test
