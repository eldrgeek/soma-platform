# Runs the SOMA Studio and Puppet runtime tests on every pull request that
# touches either package. Added 2026-10-21 (bead sp-o7t): studio-only pull
# requests had no check at all, because the soma-forge Netlify site skips its
# deploy preview when nothing under its base folder (the runtime) changed, and
# pr-merge-green needs at least one real check before it will merge.
name: soma-studio

on:
  pull_request:
    paths:
      - 'packages/soma-studio/**'
      - 'packages/soma-puppet-runtime/**'
      - 'packages/soma-play/**'
      - 'packages/soma-video/**'
      - '.github/workflows/soma-studio.yml'
  # On master the runtime's mutation check runs in full and seeds the cache
  # that pull requests start from (pull request caches are not shared).
  push:
    branches:
      - master
    paths:
      - 'packages/soma-studio/**'
      - 'packages/soma-puppet-runtime/**'
      - 'packages/soma-play/**'
      - 'packages/soma-video/**'
      - '.github/workflows/soma-studio.yml'

jobs:
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/soma-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests
        run: npm test
      - name: Mutation check (breaks the source on purpose; every break must be caught)
        run: npm run mutation

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/soma-puppet-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Node tests
        run: npm test
      # Incremental mutation check: a mutant caught before is skipped while the
      # file it changes and the tests that caught it are unchanged.
      - name: Restore mutation results
        uses: actions/cache/restore@v4
        with:
          path: packages/soma-puppet-runtime/.mutation-cache.json
          key: mutation-runtime-${{ github.sha }}
          restore-keys: mutation-runtime-
      - name: Mutation check (loosens each server rule on purpose; every break must be caught)
        run: npm run mutation -- ${{ github.event_name == 'push' && '--full' || '' }}
      - name: Save mutation results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: packages/soma-puppet-runtime/.mutation-cache.json
          key: mutation-runtime-${{ github.sha }}

  play:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/soma-play
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests
        run: npm test

  # VideoMaker's components (Puppet v0.5, bead sp-go2).
  video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/soma-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests
        run: npm test
