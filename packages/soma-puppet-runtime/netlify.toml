[build]
  publish = "site/public"
  functions = "site/functions"
  # SOMA Studio (packages/soma-studio) is served from this site at /studio/,
  # so it shares the sign-in session with the app it shows.
  command = "node ../soma-studio/scripts/install.mjs site/public/studio"
  # Netlify skips a build when nothing in this base folder changed, which
  # silently dropped studio-only merges (soma-platform #19, 2026-10-21). Build
  # when the studio, the speech component or soma-play (Stage Read's server
  # half) changed too. Exit 0 skips.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../soma-studio ../soma-speech ../soma-play"

[[redirects]]
  from = "/soma-chip/*"
  to = "https://soma-chip.netlify.app/:splat"
  status = 200
  force = true

# Before /api/*: the studio has its own function.
[[redirects]]
  from = "/api/studio"
  to = "/.netlify/functions/studio"
  status = 200

[[redirects]]
  from = "/api/studio/*"
  to = "/.netlify/functions/studio"
  status = 200

# The Punctuated voice of the studio mic (packages/soma-speech) asks here for a token.
[[redirects]]
  from = "/api/speech-token"
  to = "/.netlify/functions/speech-token"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
